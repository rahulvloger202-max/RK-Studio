name: Compile Native PTY

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-native-pty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Android NDK and Compile libprimx_pty.so
        run: |
          set -e
          echo "Searching for Android NDK..."
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK_DIR"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CPP_FILE=""
          if [ -f "primx_pty.cpp" ]; then
            CPP_FILE="primx_pty.cpp"
          elif [ -f "app/src/main/cpp/primx_pty.cpp" ]; then
            CPP_FILE="app/src/main/cpp/primx_pty.cpp"
          else
            CPP_FILE=$(find . -name "primx_pty.cpp" | head -n 1)
          fi

          if [ -z "$CPP_FILE" ]; then
            echo "ERROR: primx_pty.cpp not found in repository!"
            exit 1
          fi
          echo "Found source file: $CPP_FILE"

          mkdir -p prebuilt/arm64-v8a
          mkdir -p prebuilt/armeabi-v7a
          mkdir -p prebuilt/x86_64

          echo "Compiling for arm64-v8a..."
          "$TOOLCHAIN/aarch64-linux-android21-clang++" \
            -shared -fPIC -O2 -Wall \
            "$CPP_FILE" \
            -o prebuilt/arm64-v8a/libprimx_pty.so \
            -llog
          "$TOOLCHAIN/llvm-strip" --strip-unneeded prebuilt/arm64-v8a/libprimx_pty.so

          echo "Compiling for armeabi-v7a..."
          "$TOOLCHAIN/armv7a-linux-androideabi21-clang++" \
            -shared -fPIC -O2 -Wall \
            "$CPP_FILE" \
            -o prebuilt/armeabi-v7a/libprimx_pty.so \
            -llog
          "$TOOLCHAIN/llvm-strip" --strip-unneeded prebuilt/armeabi-v7a/libprimx_pty.so

          echo "Compiling for x86_64..."
          "$TOOLCHAIN/x86_64-linux-android21-clang++" \
            -shared -fPIC -O2 -Wall \
            "$CPP_FILE" \
            -o prebuilt/x86_64/libprimx_pty.so \
            -llog
          "$TOOLCHAIN/llvm-strip" --strip-unneeded prebuilt/x86_64/libprimx_pty.so

          ls -lh prebuilt/arm64-v8a/libprimx_pty.so
          ls -lh prebuilt/armeabi-v7a/libprimx_pty.so

      - name: Save Compiled .so Files Back to Repository
        run: |
          git config user.name "PRIMX Cloud Builder"
          git config user.email "builder@primx.local"
          git add -f prebuilt/arm64-v8a/libprimx_pty.so prebuilt/armeabi-v7a/libprimx_pty.so prebuilt/x86_64/libprimx_pty.so
          if git diff --cached --quiet; then
            echo "No changes in .so binaries to commit."
          else
            git commit -m "Auto-build: Updated prebuilt libprimx_pty.so binaries [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Upload Compiled .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primx-pty-native-libs
          path: prebuilt/
