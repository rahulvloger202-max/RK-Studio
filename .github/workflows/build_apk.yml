name: Compile Native PTY

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Compile Native C++ PTY Library
        run: |
          mkdir -p build_output
          TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64
          $TOOLCHAIN/bin/aarch64-linux-android28-clang++ -shared -fPIC -o build_output/libprimx_pty.so app/src/main/cpp/terminal_pty.cpp -llog
          
      - name: Upload .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primx-pty-native-libs
          path: build_output/libprimx_pty.so
