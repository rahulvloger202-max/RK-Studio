name: Compile Native PTY

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Compile Pure C++ Termux Engine
        run: |
          echo "Starting Android NDK C++ Compiler..."
          mkdir -p build_output
          
          # Android NDK Clang (Stand-alone C++ compilation)
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          $TOOLCHAIN/bin/clang++ --target=aarch64-linux-android28 -shared -fPIC -o build_output/libprimx_pty.so app/src/main/cpp/terminal_pty.cpp -llog
          
          echo "Build Complete!"
          
      - name: Upload .so Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primx-pty-native-libs
          path: build_output/libprimx_pty.so
