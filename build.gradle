buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // यह आपके ग्रेडेल प्लगइन का वर्ज़न है (अगर आप कमांड लाइन से बिल्ड कर रहे हैं तो यह काम आएगा)
        classpath 'com.android.tools.build:gradle:7.4.2' 
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
