plugins {
    id 'com.android.application'
}

android {
    namespace 'com.primx.ui.terminal'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.primx.ui.terminal"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }

    // YEH BLOCK ZAROORI HAI: Isse compiler ko pata chalega ki .so file kahan rakhi hai
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Agar koi dependency ho toh yahan aayegi
}
